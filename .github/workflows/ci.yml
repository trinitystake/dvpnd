name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # make build derives the version from git describe
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: make build
      - run: ./bin/dvpnd --help | head -3

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Builds the same image operators run (docs/operator.md, section 6), so a
      # base-image or toolchain bump is checked before it is merged.
      - run: docker build --file Dockerfile --tag dvpnd:ci .
      - name: Smoke test the image
        run: |
          docker run --rm dvpnd:ci process --help | head -3
          docker run --rm dvpnd:ci sh -c 'wg --version && v2ray version | head -1 && hnsd -v && iptables -V'

  licences:
    name: Licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The fork's legal position depends on never importing code without an
      # open-source licence. sentinel-go-sdk ships no licence file at all.
      - name: Refuse unlicensed Sentinel SDK
        run: |
          if grep -q 'sentinel-official/sentinel-go-sdk' go.mod go.sum; then
            echo '::error::github.com/sentinel-official/sentinel-go-sdk carries no licence and must not be a dependency'
            exit 1
          fi
      - name: Pinned sentinelhub is still Apache-2.0
        run: |
          go mod download github.com/sentinel-official/sentinelhub/v12
          mod=$(go list -m -f '{{.Dir}}' github.com/sentinel-official/sentinelhub/v12)
          [ -n "$mod" ] && [ -f "$mod/LICENSE" ] || { echo "::error::sentinelhub module directory not found ($mod)"; exit 1; }
          head -2 "$mod/LICENSE" | grep -q 'Apache License' || { echo '::error::sentinelhub LICENSE is no longer Apache-2.0'; exit 1; }
      - name: go-licenses
        run: |
          go run github.com/google/go-licenses@v1.6.0 check ./... \
            --ignore github.com/trinitystake/dvpnd \
            --disallowed_types=forbidden,restricted,unknown
      - name: SPDX headers present
        run: |
          missing=$(grep -L 'SPDX-License-Identifier: Apache-2.0' $(git ls-files '*.go') || true)
          [ -z "$missing" ] || { echo "::error::missing SPDX header:"; echo "$missing"; exit 1; }

  provenance:
    name: Fork provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash docs/provenance/verify-fork.sh

  vulnerabilities:
    name: govulncheck (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Advisory: findings are reported as warnings and in the job summary, but
      # never fail the run or a pull request's checks. Dependabot brings the
      # fixes; the licence gate is what must stay red on a bad bump.
      - name: govulncheck
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... > govulncheck.txt 2>&1
          status=$?
          set -e
          { echo '## govulncheck'; echo; echo '```'; cat govulncheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            n=$(grep -c '^Vulnerability #' govulncheck.txt || true)
            echo "::warning::govulncheck reported $n vulnerabilities reachable from this code; see the job summary"
          fi
