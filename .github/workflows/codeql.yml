name: "CodeQL"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# The repository hands workflows a read-only token by default, which is enough to
# run the queries but not to publish what they find: without security-events the
# upload step fails and the whole run is marked failed.
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        languages:
          - go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.languages }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.languages }}
